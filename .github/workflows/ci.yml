name: Swift Build & Test CI

on:
  push:
    branches:
      - 'dev-*'
  pull_request:
    branches:
      - 'dev-*'
      - main

jobs:
  swift-test:
    name: Build & Run BoltZipCoreTests
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect macOS & Swift toolchain
        run: |
          sw_vers
          uname -m
          swift --version
          xcodebuild -version || true

      - name: Run unit tests
        run: swift test
